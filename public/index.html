<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1450">
<title>Recuerdos de la fiesta</title>
<style>
:root{--ink:#fff;--mut:#cfc6f5;--glass:rgba(255,255,255,.12);--edge:rgba(255,255,255,.28);
--f:"Avenir Next","Trebuchet MS",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--f);
background:radial-gradient(70% 45% at 100% 0%,#e040c8aa,transparent 70%),
radial-gradient(70% 45% at 0% 100%,#14b8c6aa,transparent 70%),
linear-gradient(160deg,#1b1450 0%,#4b2bb0 45%,#2a1f7a 100%);background-attachment:fixed;
padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:560px;margin:0 auto;padding:18px 14px 48px;display:grid;gap:14px}
.glass{background:var(--glass);border:1px solid var(--edge);border-radius:24px;
-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 14px 34px #0004}
@supports not (backdrop-filter:blur(1px)){.glass{background:#3b2a8acc}}
.hd{display:flex;gap:14px;align-items:center;padding:16px}
.logo{flex:none;width:52px;height:52px;border-radius:50%;background:conic-gradient(#ff8a3d,#ff3d81,#8b5cf6,#38bdf8,#ff8a3d);display:grid;place-items:center}
.logo i{width:30px;height:30px;border-radius:50%;background:#2a1f7a}
h1{margin:0;font-size:1.45rem;line-height:1.1;font-weight:800;letter-spacing:-.01em}
.hd p{margin:4px 0 0;color:var(--mut);font-size:.92rem}
.stat{display:flex;align-items:center;gap:18px;padding:16px 18px}
.rw{position:relative;flex:none;width:112px;height:112px}
.rw svg{width:100%;height:100%;transform:rotate(-90deg)}
.rw circle{fill:none;stroke-width:11;stroke-linecap:round}
.tr{stroke:rgba(255,255,255,.16)}
.rc{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.rc b{font-size:1.9rem;line-height:1}
.rc span{font-size:.7rem;color:var(--mut)}
.lg{list-style:none;margin:0;padding:0;display:grid;gap:10px;font-size:1.02rem}
.lg i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px}
.lg b{font-size:1.25rem;margin-right:4px}
.who{padding:12px 14px}
#name{width:100%;padding:13px 16px;border-radius:16px;border:1px solid var(--edge);background:rgba(255,255,255,.1);color:var(--ink);font:inherit;font-size:1rem}
#name::placeholder{color:var(--mut)}
#name:focus,.tile:focus-within{outline:3px solid #ffd23f;outline-offset:2px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;overflow:hidden;border-radius:22px;padding:16px;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;min-height:112px;
box-shadow:0 10px 24px #0004,inset 0 1px 0 #fff5;transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile b{font-size:1.12rem}
.tile small{opacity:.92;font-size:.8rem}
.t1{grid-column:1/-1;min-height:132px;background:linear-gradient(135deg,#ff8a3d,#ff3d81 60%,#c026d3)}
.t2{background:linear-gradient(135deg,#6366f1,#38bdf8)}
.t3{background:linear-gradient(135deg,#10b981,#22d3ee)}
.ic{font-size:1.9rem;margin-bottom:auto}
.sh{position:absolute;right:18px;top:50%;width:78px;height:78px;margin-top:-39px;border-radius:50%;border:4px solid #fff;padding:7px}
.sh i{display:block;height:100%;border-radius:50%;background:#fff;opacity:.92}
input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
#st{min-height:1.3em;margin:0;text-align:center;color:#ffe27a;font-size:.95rem}
#bar{height:6px;border-radius:4px;background:rgba(255,255,255,.2);overflow:hidden;display:none}
#bar b{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff8a3d,#ff3d81)}
.cnt{margin:6px 4px 0;font-weight:800;font-size:1.1rem}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.it{position:relative;aspect-ratio:1;border-radius:20px;overflow:hidden;cursor:pointer;border:1px solid var(--edge);background:rgba(255,255,255,.1);box-shadow:0 8px 20px #0004}
.it img,.it video{width:100%;height:100%;object-fit:cover;display:block}
.it span{position:absolute;left:8px;bottom:8px;max-width:calc(100% - 16px);padding:3px 10px;border-radius:12px;font-size:.78rem;font-weight:700;background:rgba(27,20,80,.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it em{position:absolute;top:8px;right:8px;font-style:normal;background:linear-gradient(135deg,#6366f1,#38bdf8);border-radius:12px;padding:2px 9px;font-size:.78rem}
.empty{text-align:center;color:var(--mut);padding:22px 0}
#lb{position:fixed;inset:0;background:rgba(14,10,50,.95);display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;z-index:5}
#lb img,#lb video{max-width:100%;max-height:80%;border-radius:16px}
#lb p{margin:12px 0 0;color:var(--mut)}
#lb button{position:absolute;top:calc(12px + env(safe-area-inset-top));right:14px;width:44px;height:44px;border-radius:50%;border:1px solid var(--edge);background:var(--glass);color:#fff;font-size:1.2rem}
@media (min-width:520px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<header class="glass hd"><div class="logo"><i></i></div><div><h1 id="title">Recuerdos de la fiesta</h1><p>Toma una foto o un vídeo y aparece aquí para todos.</p></div></header>

<section class="glass stat" aria-label="Resumen del álbum">
<div class="rw"><svg viewBox="0 0 100 100" aria-hidden="true">
<defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8a3d"/><stop offset="1" stop-color="#ff3d81"/></linearGradient>
<linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#6366f1"/></linearGradient></defs>
<circle class="tr" cx="50" cy="50" r="40"/>
<circle id="rp" cx="50" cy="50" r="40" stroke="url(#g1)" stroke-dasharray="0 251.3"/>
<circle id="rv" cx="50" cy="50" r="40" stroke="url(#g2)" stroke-dasharray="0 251.3"/></svg>
<div class="rc"><b id="total">0</b><span>recuerdos</span></div></div>
<ul class="lg"><li><i style="background:linear-gradient(135deg,#ff8a3d,#ff3d81)"></i><b id="np">0</b>fotos</li>
<li><i style="background:linear-gradient(135deg,#38bdf8,#6366f1)"></i><b id="nv">0</b>vídeos</li></ul>
</section>

<section class="glass who"><input id="name" type="text" placeholder="Tu nombre" maxlength="20" autocomplete="given-name" aria-label="Tu nombre"></section>

<section class="tiles">
<label class="tile t1"><span class="sh"><i></i></span><b>Tomar foto</b><small>abre la cámara</small><input type="file" id="cf" accept="image/*" capture="environment"></label>
<label class="tile t2"><span class="ic">🎥</span><b>Grabar vídeo</b><small>hasta ~15 segundos</small><input type="file" id="cv" accept="video/*" capture="environment"></label>
<label class="tile t3"><span class="ic">🖼️</span><b>Mi galería</b><small>elige varias</small><input type="file" id="gal" accept="image/*,video/*" multiple></label>
</section>
<p id="st" role="status"></p><div id="bar"><b></b></div>

<p class="cnt">Álbum de la fiesta</p>
<div class="grid" id="grid"></div>
<div class="empty" id="empty" hidden>Aún no hay recuerdos. Toma la primera foto.</div>
</main>
<div id="lb"><button id="x" aria-label="Cerrar">✕</button><div id="lbc"></div><p id="lbp"></p></div>

<script>
const $=id=>document.getElementById(id);
const qs=new URLSearchParams(location.search);
let code=qs.get('c')||'';try{if(code)localStorage.setItem('code',code);else code=localStorage.getItem('code')||''}catch(e){}
try{$('name').value=localStorage.getItem('n')||''}catch(e){}
$('name').onchange=()=>{try{localStorage.setItem('n',$('name').value)}catch(e){}};
const st=t=>$('st').textContent=t;

fetch('/api/config').then(r=>r.json()).then(c=>{$('title').textContent=c.name;document.title=c.name}).catch(()=>{});

function shrink(f){return new Promise(res=>{
  if(!f.type.startsWith('image/')||f.type==='image/gif')return res(f);
  const im=new Image(),u=URL.createObjectURL(f);
  im.onload=()=>{const s=Math.min(1,2000/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    c.toBlob(b=>{URL.revokeObjectURL(u);res(b||f)},'image/jpeg',.85)};
  im.onerror=()=>res(f);im.src=u;})}

function post(blob,name){return new Promise((ok,fail)=>{
  const fd=new FormData();fd.append('by',$('name').value.trim()||'Invitado');fd.append('file',blob,name);
  const x=new XMLHttpRequest();x.open('POST','/api/upload');if(code)x.setRequestHeader('x-code',code);
  x.upload.onprogress=e=>{if(e.lengthComputable)$('bar').firstChild.style.width=(e.loaded/e.total*100)+'%'};
  x.onload=()=>x.status===200?ok():fail(x.status);x.onerror=()=>fail(0);x.send(fd)})}

async function send(files){
  $('bar').style.display='block';let n=0;
  for(const f of files){
    st('Subiendo '+(n+1)+' de '+files.length+'…');$('bar').firstChild.style.width='0';
    try{await post(await shrink(f),f.name||'foto');n++}
    catch(s){$('bar').style.display='none';
      st(s===401?'Este enlace no tiene el código. Escanea de nuevo el QR.':s===413?'Ese archivo pesa más de 25 MB. Prueba con un vídeo más corto.':s===415?'Ese tipo de archivo no se puede subir.':'No se pudo subir. Revisa tu conexión e inténtalo otra vez.');return}
  }
  $('bar').style.display='none';st('¡Listo! '+n+(n===1?' recuerdo guardado':' recuerdos guardados'));load();
}
['cf','cv','gal'].forEach(i=>$(i).onchange=e=>{const f=[...e.target.files];e.target.value='';if(f.length)send(f)});

const isVid=n=>/\.(mp4|mov|webm)$/.test(n);
const by=n=>n.split('_')[2].replace(/\.\w+$/,'').replace(/-/g,' ');
function ring(p,v){
  const C=251.3,t=p+v,gap=p&&v?4:0,a=t?Math.max(0,C*p/t-gap):0,b=t?Math.max(0,C*v/t-gap):0;
  $('rp').setAttribute('stroke-dasharray',a+' '+(C-a));$('rp').setAttribute('stroke-dashoffset',0);
  $('rv').setAttribute('stroke-dasharray',b+' '+(C-b));$('rv').setAttribute('stroke-dashoffset',-(a+gap));
}
let last='';
async function load(){
  try{
    const names=await (await fetch('/api/list')).json();
    if(!Array.isArray(names)||names.join()===last)return;last=names.join();
    const v=names.filter(isVid).length,p=names.length-v;
    $('empty').hidden=names.length>0;$('total').textContent=names.length;$('np').textContent=p;$('nv').textContent=v;ring(p,v);
    const g=$('grid');g.textContent='';
    names.forEach(n=>{
      const d=document.createElement('div');d.className='it';
      const m=document.createElement(isVid(n)?'video':'img');m.src='/media/'+n;
      if(isVid(n)){m.muted=true;m.preload='metadata';m.playsInline=true}else{m.loading='lazy';m.alt='Foto de '+by(n)}
      const s=document.createElement('span');s.textContent=by(n);
      d.append(m,s);if(isVid(n)){const e=document.createElement('em');e.textContent='▶';d.append(e)}
      d.onclick=()=>openLb(n);g.append(d)});
  }catch(e){}
}
function openLb(n){
  const c=$('lbc');c.textContent='';const m=document.createElement(isVid(n)?'video':'img');m.src='/media/'+n;
  if(isVid(n)){m.controls=true;m.playsInline=true;m.autoplay=true}c.append(m);
  $('lbp').textContent='De '+by(n);$('lb').style.display='flex'}
const close=()=>{$('lb').style.display='none';$('lbc').textContent=''};
$('x').onclick=close;$('lb').onclick=e=>{if(e.target.id==='lb')close()};
load();setInterval(load,15000);
</script>
</body>
</html>
