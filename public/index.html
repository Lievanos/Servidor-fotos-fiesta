<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#130f1d">
<title>Recuerdos de la fiesta</title>
<style>
:root{--night:#130f1d;--card:#1f1830;--flash:#fffdf5;--pink:#ff3d81;--sun:#ffd23f;--mut:#a99bc0;
--f:"Avenir Next","Trebuchet MS",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--night);color:var(--flash);font-family:var(--f);
padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:560px;margin:0 auto;padding:26px 16px 48px}
h1{font-size:2.1rem;line-height:1.05;margin:0 0 6px;font-weight:800;letter-spacing:-.02em}
.sub{margin:0 0 22px;color:var(--mut)}
.cam{text-align:center;margin-bottom:26px}
#name{width:100%;max-width:300px;padding:12px 14px;border-radius:12px;border:1.5px solid #3a2f55;background:transparent;color:var(--flash);font:inherit;text-align:center;margin-bottom:22px}
#name:focus,.sec:focus-within,.shutter:focus-within{outline:3px solid var(--sun);outline-offset:3px}
.shutter{display:block;width:124px;height:124px;margin:0 auto 10px;border-radius:50%;border:5px solid var(--flash);padding:8px;cursor:pointer}
.shutter i{display:block;width:100%;height:100%;border-radius:50%;background:var(--pink);box-shadow:inset 0 -6px 0 #0003;transition:transform .12s}
.shutter:active i{transform:scale(.88)}
.lab{font-weight:700;margin-bottom:16px}
.row{display:flex;gap:10px;justify-content:center}
.sec{flex:1;max-width:190px;padding:12px 8px;border-radius:12px;background:var(--card);font-weight:600;cursor:pointer;font-size:.95rem}
input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
#st{min-height:1.4em;margin:14px 0 0;font-size:.95rem;color:var(--sun)}
#bar{height:5px;border-radius:3px;background:#3a2f55;margin:8px auto 0;max-width:300px;overflow:hidden;display:none}
#bar b{display:block;height:100%;width:0;background:var(--pink)}
.cnt{font-weight:700;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.po{background:var(--flash);padding:7px 7px 24px;border-radius:3px;position:relative;cursor:pointer;box-shadow:0 6px 16px #0006;transform:rotate(var(--r))}
.po .im{aspect-ratio:1;background:#ddd;overflow:hidden}
.po img,.po video{width:100%;height:100%;object-fit:cover;display:block}
.po span{position:absolute;left:8px;right:8px;bottom:4px;color:#2a2238;font-size:.78rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.po em{position:absolute;top:12px;right:12px;font-style:normal;background:#000a;color:#fff;border-radius:9px;padding:1px 7px;font-size:.75rem}
.empty{text-align:center;color:var(--mut);padding:30px 0}
#lb{position:fixed;inset:0;background:#000f;display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;z-index:5}
#lb img,#lb video{max-width:100%;max-height:80%}
#lb p{margin:12px 0 0;color:var(--mut)}
#lb button{position:absolute;top:calc(12px + env(safe-area-inset-top));right:14px;background:var(--card);color:var(--flash);border:0;border-radius:50%;width:44px;height:44px;font-size:1.3rem}
@media (min-width:520px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<h1 id="title">Recuerdos de la fiesta</h1>
<p class="sub">Toma una foto o un vídeo y aparece aquí para todos.</p>

<section class="cam">
<input id="name" type="text" placeholder="Tu nombre" maxlength="20" autocomplete="given-name" aria-label="Tu nombre">
<label class="shutter" aria-label="Tomar foto"><i></i><input type="file" id="cf" accept="image/*" capture="environment"></label>
<div class="lab">Tomar foto</div>
<div class="row">
<label class="sec">🎥 Grabar vídeo<input type="file" id="cv" accept="video/*" capture="environment"></label>
<label class="sec">🖼️ Elegir de mi galería<input type="file" id="gal" accept="image/*,video/*" multiple></label>
</div>
<p id="st" role="status"></p><div id="bar"><b></b></div>
</section>

<p class="cnt" id="cnt"></p>
<div class="grid" id="grid"></div>
<div class="empty" id="empty" hidden>Aún no hay recuerdos. Toma la primera foto.</div>
</main>
<div id="lb"><button id="x" aria-label="Cerrar">✕</button><div id="lbc"></div><p id="lbp"></p></div>

<script>
const $=id=>document.getElementById(id);
const qs=new URLSearchParams(location.search);
let code=qs.get('c')||'';try{if(code)localStorage.setItem('code',code);else code=localStorage.getItem('code')||''}catch(e){}
try{$('name').value=localStorage.getItem('n')||''}catch(e){}
$('name').onchange=()=>{try{localStorage.setItem('n',$('name').value)}catch(e){}};
const st=t=>$('st').textContent=t;

fetch('/api/config').then(r=>r.json()).then(c=>{$('title').textContent=c.name;document.title=c.name}).catch(()=>{});

function shrink(f){return new Promise(res=>{
  if(!f.type.startsWith('image/')||f.type==='image/gif')return res(f);
  const im=new Image(),u=URL.createObjectURL(f);
  im.onload=()=>{const s=Math.min(1,2000/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    c.toBlob(b=>{URL.revokeObjectURL(u);res(b||f)},'image/jpeg',.85)};
  im.onerror=()=>res(f);im.src=u;})}

function post(blob,name){return new Promise((ok,fail)=>{
  const fd=new FormData();fd.append('by',$('name').value.trim()||'Invitado');fd.append('file',blob,name);
  const x=new XMLHttpRequest();x.open('POST','/api/upload');if(code)x.setRequestHeader('x-code',code);
  x.upload.onprogress=e=>{if(e.lengthComputable)$('bar').firstChild.style.width=(e.loaded/e.total*100)+'%'};
  x.onload=()=>x.status===200?ok():fail(x.status);x.onerror=()=>fail(0);x.send(fd)})}

async function send(files){
  $('bar').style.display='block';let n=0;
  for(const f of files){
    st('Subiendo '+(n+1)+' de '+files.length+'…');$('bar').firstChild.style.width='0';
    try{await post(await shrink(f),f.name||'foto');n++}
    catch(s){$('bar').style.display='none';
      st(s===401?'Este enlace no tiene el código. Escanea de nuevo el QR.':s===413?'Ese archivo pesa más de 25 MB. Prueba con un vídeo más corto.':s===415?'Ese tipo de archivo no se puede subir.':'No se pudo subir. Revisa tu conexión e inténtalo otra vez.');return}
  }
  $('bar').style.display='none';st('¡Listo! '+n+(n===1?' recuerdo guardado':' recuerdos guardados'));load();
}
['cf','cv','gal'].forEach(i=>$(i).onchange=e=>{const f=[...e.target.files];e.target.value='';if(f.length)send(f)});

const isVid=n=>/\.(mp4|mov|webm)$/.test(n);
const by=n=>n.split('_')[2].replace(/\.\w+$/,'').replace(/-/g,' ');
let last='';
async function load(){
  try{
    const names=await (await fetch('/api/list')).json();
    if(!Array.isArray(names)||names.join()===last)return;last=names.join();
    $('empty').hidden=names.length>0;$('cnt').textContent=names.length?names.length+(names.length===1?' recuerdo':' recuerdos'):'';
    const g=$('grid');g.textContent='';
    names.forEach((n,i)=>{
      const d=document.createElement('div');d.className='po';d.style.setProperty('--r',((i%3)-1)*1.2+'deg');
      const w=document.createElement('div');w.className='im';
      const m=document.createElement(isVid(n)?'video':'img');m.src='/media/'+n;
      if(isVid(n)){m.muted=true;m.preload='metadata';m.playsInline=true}else{m.loading='lazy';m.alt='Foto de '+by(n)}
      const s=document.createElement('span');s.textContent=by(n);
      w.append(m);d.append(w,s);if(isVid(n)){const e=document.createElement('em');e.textContent='▶';d.append(e)}
      d.onclick=()=>openLb(n);g.append(d)});
  }catch(e){}
}
function openLb(n){
  const c=$('lbc');c.textContent='';const m=document.createElement(isVid(n)?'video':'img');m.src='/media/'+n;
  if(isVid(n)){m.controls=true;m.playsInline=true;m.autoplay=true}c.append(m);
  $('lbp').textContent='De '+by(n);$('lb').style.display='flex'}
const close=()=>{$('lb').style.display='none';$('lbc').textContent=''};
$('x').onclick=close;$('lb').onclick=e=>{if(e.target.id==='lb')close()};
load();setInterval(load,15000);
</script>
</body>
</html>
